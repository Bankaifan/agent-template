name: agent-dev
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
# One run per issue; the 2-job cap is kept by the orchestrator (at most 2 open agent:dev issues).
concurrency:
  group: agent-dev-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  dev:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:dev') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/dev') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      MODEL: ${{ contains(github.event.issue.labels.*.name, 'model:sonnet') && 'sonnet' || 'haiku' }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: "476059"
          bot_name: "Bankaifan"
          prompt: |
            Act as the developer described in .agents/roles/developer.md and follow AGENTS.md.
            Task: GitHub issue #${{ env.ISSUE }} in ${{ github.repository }} (read it with gh issue view).
            Create branch agent/${{ env.ISSUE }}-<slug> from main, implement, run `make check` and the tests,
            squash the branch into ONE commit authored by Daniel without a Co-authored-by trailer, push, and open a PR with
            `gh pr create` (English ASCII title, body max 5 lines, "Closes #${{ env.ISSUE }}").
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(make:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
