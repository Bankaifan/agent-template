name: setup
# Manual, no model. Creates the labels the workflows use (idempotent) and checks the 5 secrets and the 2 variables.
# Secret values are never printed; only the names of missing ones.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
          AUTHOR_APP_KEY: ${{ secrets.AUTHOR_APP_KEY }}
          APPROVER_APP_ID: ${{ secrets.APPROVER_APP_ID }}
          APPROVER_APP_KEY: ${{ secrets.APPROVER_APP_KEY }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
        run: |
          missing=""
          for name in CLAUDE_CODE_OAUTH_TOKEN AUTHOR_APP_ID AUTHOR_APP_KEY APPROVER_APP_ID APPROVER_APP_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          missing_vars=""
          for name in AUTHOR_BOT APPROVER_BOT; do
            if [ -z "${!name}" ]; then missing_vars="$missing_vars $name"; fi
          done
          echo "missing_vars=${missing_vars# }" >> "$GITHUB_OUTPUT"
          if [ -n "$AUTHOR_APP_ID" ] && [ -n "$AUTHOR_APP_KEY" ]; then
            echo "author=true" >> "$GITHUB_OUTPUT"
          fi
      - id: app
        if: steps.check.outputs.author == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
      - name: Create labels
        if: steps.check.outputs.author == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for l in agent:dev agent:review model:sonnet review:1 review:2 review:3 needs-human idea auto-ok approved; do
            gh label create "$l" --force
          done
      - name: Report Dependabot secrets (best effort)
        if: steps.check.outputs.author == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! names=$(gh api "/repos/$GH_REPO/dependabot/secrets" --jq '.secrets[].name' 2>/dev/null); then
            echo "::warning::Cannot read Dependabot secrets (the author app lacks that permission). Check Settings > Secrets and variables > Dependabot by hand: agent-smoke fails on Dependabot PRs without them."
            exit 0
          fi
          missing=""
          for name in CLAUDE_CODE_OAUTH_TOKEN AUTHOR_APP_ID AUTHOR_APP_KEY APPROVER_APP_ID APPROVER_APP_KEY; do
            printf '%s\n' "$names" | grep -qx "$name" || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing Dependabot secrets:$missing (agent-smoke fails on Dependabot PRs until set)"
          else
            echo "All five Dependabot secrets exist."
          fi
      - name: Fail if secrets or variables are missing
        if: steps.check.outputs.missing != '' || steps.check.outputs.missing_vars != ''
        env:
          MISSING: ${{ steps.check.outputs.missing }}
          MISSING_VARS: ${{ steps.check.outputs.missing_vars }}
        run: |
          [ -z "$MISSING" ] || echo "::error::Missing secrets: $MISSING"
          [ -z "$MISSING_VARS" ] || echo "::error::Missing variables: $MISSING_VARS (bot logins of the apps, e.g. my-author[bot])"
          echo "Set secrets and variables in Settings > Secrets and variables > Actions, then run this workflow again."
          exit 1
