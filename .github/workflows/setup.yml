name: setup
# Manual, no model. Creates the labels the workflows use (idempotent) and checks the 5 secrets.
# Secret values are never printed; only the names of missing ones.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
          AUTHOR_APP_KEY: ${{ secrets.AUTHOR_APP_KEY }}
          APPROVER_APP_ID: ${{ secrets.APPROVER_APP_ID }}
          APPROVER_APP_KEY: ${{ secrets.APPROVER_APP_KEY }}
        run: |
          missing=""
          for name in CLAUDE_CODE_OAUTH_TOKEN AUTHOR_APP_ID AUTHOR_APP_KEY APPROVER_APP_ID APPROVER_APP_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          if [ -n "$AUTHOR_APP_ID" ] && [ -n "$AUTHOR_APP_KEY" ]; then
            echo "author=true" >> "$GITHUB_OUTPUT"
          fi
      - id: app
        if: steps.check.outputs.author == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
      - name: Create labels
        if: steps.check.outputs.author == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for l in agent:dev agent:review model:sonnet review:1 review:2 needs-human; do
            gh label create "$l" --force
          done
      - name: Fail if secrets are missing
        if: steps.check.outputs.missing != ''
        env:
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          echo "::error::Missing secrets: $MISSING"
          echo "Set them in Settings > Secrets and variables > Actions, then run this workflow again."
          exit 1
