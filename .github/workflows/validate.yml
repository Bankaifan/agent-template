name: validate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Fallback used by agent-dev / agent-fix when no run exists for a bot-pushed head SHA.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install pinned tools
        run: bash tools/ci/install_tools.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Checks (ruff, pytest, actionlint, zizmor, repo checks)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # workflow_dispatch: check_pr_form reads title/body with `gh pr view`
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: make check
