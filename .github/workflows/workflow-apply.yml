name: workflow-apply
run-name: "workflow-apply: ${{ github.event.workflow_run.head_branch }}"
# Agent runs cannot push .github/workflows/ (their model token has no `workflows` scope). agent-dev/agent-fix carry
# such changes as .agents/workflow-patches/<issue>.patch; once the security reviewer approved that head (status
# `security-review` success), this script-only job applies the patch, drops the file and pushes. The new head runs CI
# and both reviews again. Owner paths (CODEOWNERS) and paths outside .github/workflows/ are refused (tools/workflow_patch.py).
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] no PR code runs: main's script only applies a reviewed text patch with git
    workflows: [agent-security-review]
    types: [completed]
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: workflow-apply-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
        run: |
          for n in AUTHOR_CLIENT_ID AUTHOR_BOT; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
      # main only; the PR branch is fetched as data and never run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes the applied patch with the app token persisted by checkout
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Find the agent PR and its security verdict
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api -X GET "repos/$GH_REPO/pulls" -f state=open -f head="${GH_REPO%%/*}:$BRANCH" \
            | jq -c --arg s "$SHA" '[.[] | select(.head.sha == $s)] | first // empty')
          if [ -z "$pr" ]; then echo "No open PR with head $SHA"; exit 0; fi
          labels=",$(jq -r '[.labels[].name] | join(",")' <<<"$pr"),"
          python3 tools/agent_guard.py agent-pr "$(jq -r .user.login <<<"$pr")" "$labels" || { echo "Not an agent PR"; exit 0; }
          state=$(gh api "repos/$GH_REPO/commits/$SHA/statuses" --jq '[.[] | select(.context == "security-review")][0].state // "none"')
          if [ "$state" != "success" ]; then echo "security-review is $state for $SHA"; exit 0; fi
          { echo "num=$(jq -r .number <<<"$pr")"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"
      - name: Apply the workflow patch
        if: steps.pr.outputs.num != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.num }}
          SHA: ${{ steps.pr.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
          rc=0
          out=$(python3 tools/workflow_patch.py apply "$BRANCH" "$SHA") || rc=$?
          echo "$out"
          if [ "$rc" = 3 ]; then
            gh pr comment "$PR" --body "workflow-apply refused the workflow patch (see the run log): Daniel applies it by hand. Run: $RUN_URL"
            gh pr edit "$PR" --add-label needs-human
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
